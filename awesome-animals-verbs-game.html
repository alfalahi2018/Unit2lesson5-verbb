<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome Animals – Verbs Game</title>
<style>
:root{--ink:#1d2b3a;--bg:#eaf7ee;--card:#fff;--g:#2fb35f;--r:#e5484d;--y:#ffc233;--b:#2b7de9;--line:#cfd8dc}
@media (prefers-color-scheme:dark){:root{--ink:#f1f5f9;--bg:#10231a;--card:#1b3326;--line:#3c5a49}}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:12px;background-image:radial-gradient(circle at 10% 10%,#ffffff22 0 40px,transparent 41px),radial-gradient(circle at 90% 80%,#ffffff22 0 60px,transparent 61px)}
.wrap{max-width:820px;margin:auto}
.top{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.top input{border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;width:150px;padding:2px}
.stars{font-size:22px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:22px;margin-top:12px;padding:14px;animation:pop .5s}
.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:30px;font-weight:900;border:3px solid var(--ink);border-radius:30px;padding:2px 18px;background:var(--y);color:#1d2b3a}
.inst{background:#ffe9a8;color:#1d2b3a;padding:6px 14px;border-radius:10px;font-weight:700;transform:rotate(-1deg)}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chip{border:3px solid var(--ink);background:#fff;color:#1d2b3a;font:inherit;font-weight:800;font-size:18px;padding:6px 16px;border-radius:12px;cursor:pointer;transition:.15s;box-shadow:0 4px 0 var(--ink)}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--b);color:#fff;transform:translateY(-4px) scale(1.08)}
.chip.used{opacity:.3;pointer-events:none;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.pic{border:3px dashed var(--ink);border-radius:16px;padding:8px;text-align:center;position:relative;background:linear-gradient(#fff,#e9f6ff);color:#1d2b3a}
.num{position:absolute;top:6px;left:8px;width:28px;height:28px;border:3px solid var(--ink);border-radius:50%;font-weight:900;background:#fff;line-height:22px}
.art{font-size:64px;height:96px;display:flex;align-items:center;justify-content:center;gap:2px;filter:drop-shadow(2px 3px 0 #0002)}
.art small{font-size:34px}
.slot{height:44px;margin-top:6px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;cursor:pointer}
.slot.line{border:0;border-bottom:3px solid var(--ink);border-radius:0}
.slot.ok{background:#c9f5d6;color:#176b36;animation:pop .5s}
.slot.bad{animation:shake .4s;background:#ffd3d5}
.sent{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;padding:10px;margin:10px 0;font-size:19px;flex-wrap:wrap;color:var(--ink)}
.sent .art{font-size:40px;height:auto}
.blank{display:inline-block;min-width:130px;height:34px;border-bottom:3px solid var(--ink);text-align:center;font-weight:900;cursor:pointer;vertical-align:bottom}
.blank.ok{color:#176b36;background:#c9f5d6;border-radius:8px}
.blank.bad{animation:shake .4s;background:#ffd3d5}
.btn{display:block;margin:14px auto 0;border:3px solid var(--ink);background:var(--g);color:#fff;font:inherit;font-weight:900;font-size:20px;padding:10px 28px;border-radius:30px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.msg{text-align:center;font-weight:800;min-height:26px;margin-top:8px}
.foot{text-align:center;margin:16px 0 4px;font-weight:700}
.big{text-align:center}.big .art{font-size:90px;height:auto}
.fx{position:fixed;pointer-events:none;font-size:30px;animation:fly 1.4s ease-out forwards;z-index:9}
@keyframes pop{0%{transform:scale(.85);opacity:.4}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.bounce{animation:bounce .6s}
@keyframes bounce{40%{transform:translateY(-14px) scale(1.12)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>Name: <input id="nm" placeholder="Type your name"></div>
    <div>Grade: 7</div>
    <div class="stars" id="stars">⭐ 0</div>
    <button class="chip" id="snd" style="box-shadow:none">🔊</button>
  </div>
  <div id="game"></div>
  <div class="foot">🐾 Created by T.Badria Alfalahi 🐾</div>
</div>
<script>
const LEVELS=[
 {badge:"⭐ Clevers",inst:"Match the word to the picture.",type:"pic",items:[
  {w:"fly away",a:"🕊️<small>💨</small>"},{w:"die",a:"🐟<small>💀</small>"},{w:"lay eggs",a:"🐢<small>🥚</small>"},{w:"bite",a:"🐊<small>😬</small>"}]},
 {badge:"⭐⭐ Creatives",inst:"Look at the picture and write the verb.",type:"pic",items:[
  {w:"roar",a:"🦁<small>📢</small>"},{w:"sting",a:"🐝<small>☝️</small>"},{w:"dive",a:"🦈<small>🫧</small>"},{w:"curl up",a:"🦔<small>🌀</small>"}]},
 {badge:"⭐⭐⭐ Super Stars",inst:"Read the sentences and write the verbs.",type:"sent",items:[
  {w:"run away",a:"🐇🦊",s:["The rabbit saw the fox. It "," quickly."]},
  {w:"hide",a:"🐒🌳",s:["The monkey should "," in the trees when it sees danger."]},
  {w:"fight",a:"🐐🐐",s:["Two goats can "," with their horns."]},
  {w:"dig",a:"🦀🏖️",s:["The crab uses its claws to "," a hole in the sand."]}]}
];
let lvl=0,score=0,mistakes=0,sel=null,done=0,sound=true,ac;
const G=document.getElementById('game');
function beep(f,d,t='sine',v=.15,when=0){if(!sound)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);
 const s=ac.currentTime+when;g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d);}
const sOK=()=>[523,659,784].forEach((f,i)=>beep(f,.18,'triangle',.18,i*.09));
const sBAD=()=>beep(150,.3,'sawtooth',.12);
const sWIN=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.2,'triangle',.18,i*.12));
const sTap=()=>beep(700,.07,'square',.06);
document.getElementById('snd').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊':'🔇'};
function burst(el,em){const r=el.getBoundingClientRect();
 for(let i=0;i<10;i++){const s=document.createElement('span');s.className='fx';s.textContent=em[i%em.length];
 s.style.left=r.left+r.width/2+'px';s.style.top=r.top+r.height/2+'px';
 s.style.setProperty('--x',(Math.random()*240-120)+'px');s.style.setProperty('--y',(Math.random()*-220-20)+'px');
 document.body.appendChild(s);setTimeout(()=>s.remove(),1500);}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){
 const L=LEVELS[lvl];sel=null;done=0;
 let h=`<div class="panel"><div class="title"><span class="badge">${L.badge}</span><span class="inst">${L.inst}</span></div>
 <div class="bank" id="bank">${shuffle(L.items).map(i=>`<button class="chip" data-w="${i.w}">${i.w}</button>`).join('')}</div>`;
 if(L.type==='pic'){h+=`<div class="grid">${L.items.map((i,n)=>`<div class="pic"><span class="num">${n+1}</span><div class="art">${i.a}</div>
  <div class="slot ${lvl?'line':''}" data-w="${i.w}">${lvl?'':'□'}</div></div>`).join('')}</div>`;}
 else{h+=L.items.map((i,n)=>`<div class="sent"><span class="num" style="position:static;flex:none">${n+1}</span><span class="art">${i.a}</span>
  <span>${i.s[0]}<span class="blank" data-w="${i.w}"></span>${i.s[1]}</span></div>`).join('');}
 h+=`<div class="msg" id="msg">👆 Tap a word, then tap its place!</div></div>`;
 G.innerHTML=h;
 G.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{sTap();G.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=c;});
 G.querySelectorAll('.slot,.blank').forEach(s=>s.onclick=()=>place(s));
}
function place(s){
 if(s.classList.contains('ok'))return;
 const m=document.getElementById('msg');
 if(!sel){m.textContent='👆 Choose a word first!';sBAD();return;}
 if(sel.dataset.w===s.dataset.w){
  s.textContent=sel.dataset.w;s.classList.remove('bad');s.classList.add('ok');sel.classList.remove('sel');sel.classList.add('used');
  const pic=s.closest('.pic,.sent');pic.querySelector('.art').classList.add('bounce');
  sOK();burst(s,['⭐','✨','🐾','🎉']);score+=10;upd();sel=null;done++;
  m.textContent=['Great job! 🌟','Awesome! 🐾','Super! 🎉','Perfect! 🏆'][done%4];
  if(done===4)setTimeout(next,1100);
 }else{
  s.classList.add('bad');setTimeout(()=>s.classList.remove('bad'),450);sBAD();mistakes++;
  m.textContent='Oops! Try again 💪';
 }
}
function upd(){document.getElementById('stars').textContent='⭐ '+score}
function next(){
 if(lvl<2){lvl++;G.innerHTML=`<div class="panel big"><div class="art">🎉🐾</div><h2>Level complete!</h2><p>Get ready for the next level...</p><button class="btn" id="go">Next ➡️</button></div>`;sWIN();
  document.getElementById('go').onclick=render;}
 else finish();
}
function finish(){
 const n=document.getElementById('nm').value||'Champion';
 const st=mistakes<=1?'⭐⭐⭐':mistakes<=4?'⭐⭐':'⭐';
 G.innerHTML=`<div class="panel big"><div class="art">🏆🦁🐢🐝</div><h1>Well done, ${n.replace(/</g,'')}!</h1>
 <div style="font-size:42px">${st}</div><p>Score: <b>${score}</b> &nbsp;|&nbsp; Mistakes: <b>${mistakes}</b></p>
 <button class="btn" id="again">Play again 🔄</button></div>`;
 sWIN();for(let i=0;i<5;i++)setTimeout(()=>burst(document.querySelector('.big'),['🎉','⭐','🐾','🏆','✨']),i*300);
 document.getElementById('again').onclick=()=>{lvl=0;score=0;mistakes=0;upd();render();};
}
render();
</script>
</body>
</html>
